<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School for Social Research</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16130f; --paper:#f2eee6; --muted:#6d655a; --accent:#a8412a; --ease:cubic-bezier(.7,0,.2,1); }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink);
    font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }

  .maps { position:fixed; inset:0; overflow:hidden; }
  .map { position:absolute; inset:0; filter:grayscale(1) contrast(1.08) brightness(1.03);
    transition:filter .6s ease; will-change:transform; }
  .veil { position:fixed; inset:0; pointer-events:none; transition:opacity .6s ease;
    background:radial-gradient(ellipse 50% 40% at center, rgba(242,238,230,.7) 0%, rgba(242,238,230,.15) 60%, rgba(242,238,230,.55) 100%); }

  .stage { position:fixed; inset:0; display:grid; place-items:center; text-align:center;
    padding:0 16px; pointer-events:none; transition:opacity .5s ease; }
  .city { font-family:'Instrument Serif', serif; font-weight:400; line-height:.9; letter-spacing:-.02em;
    font-size:clamp(64px, 12vw, 190px); }
  .rest { font-family:'Instrument Serif', serif; font-style:italic; font-size:clamp(22px, 3.4vw, 48px);
    margin-top:.15em; }
  .meta { margin:28px auto 0; max-width:560px; font-size:14px; line-height:1.55; color:var(--muted); min-height:4.6em; }
  .meta b { color:var(--ink); font-weight:500; }

  .swap { display:inline-block; transition-property:opacity, transform, filter; transition-duration:.45s;
    transition-timing-function:cubic-bezier(.2,.7,.2,1); }
  .swap.out-up   { opacity:0; transform:translateY(-.35em); filter:blur(6px); }
  .swap.out-down { opacity:0; transform:translateY(.35em);  filter:blur(6px); }
  .swap.pre-up   { opacity:0; transform:translateY(.35em);  filter:blur(6px); transition:none; }
  .swap.pre-down { opacity:0; transform:translateY(-.35em); filter:blur(6px); transition:none; }
  /* Montage: names ride in from below with the map, a beat slower than it. */
  .swap.reel-out-up   { opacity:0; transform:translateY(-.45em); filter:blur(3px); }
  .swap.reel-out-down { opacity:0; transform:translateY(.45em);  filter:blur(3px); }
  .swap.reel-pre-up   { opacity:0; transform:translateY(.8em);   filter:blur(3px); transition:none; }
  .swap.reel-pre-down { opacity:0; transform:translateY(-.8em);  filter:blur(3px); transition:none; }
  .map img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* Tbilisi chapter: the camera never moves. The outline draws in place, photos slide in
     from the right over half the screen and pins appear; the last photo then takes the whole screen. */
  body.chapter .map { filter:none; }
  body.chapter .veil, body.chapter .stage { opacity:0; }
  .chapter-label { position:fixed; top:22px; left:25%; transform:translateX(-50%); text-align:center;
    font-family:'Instrument Serif', serif; font-size:clamp(28px, 4vw, 52px); line-height:1;
    opacity:0; pointer-events:none; transition:opacity .6s ease; }
  .chapter-label small { display:block; margin-top:8px; font-family:Inter, sans-serif; font-size:12px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  body.chapter .chapter-label { opacity:1; transition-delay:.3s; }
  body.full .chapter-label { opacity:0; transition-delay:0s; }

  .photos { position:fixed; top:0; right:0; bottom:0; width:50%; overflow:hidden; background:#1b1814;
    transform:translateX(100%); transition:transform .9s var(--ease), width 1.1s var(--ease), top 1.1s var(--ease); }
  body.split .photos { transform:translateX(0); }
  body.full .photos { width:100%; }
  .ph { position:absolute; inset:0; margin:0; overflow:hidden; transform:translateY(100%); transition:transform .9s var(--ease); }
  .ph.on   { transform:translateY(0); }
  .ph.past { transform:translateY(-100%); }
  .ph .bg { position:absolute; inset:-60px; background:center / cover no-repeat; filter:blur(40px) brightness(.8); }
  .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph figcaption { position:absolute; left:0; right:0; bottom:0; padding:120px 40px 40px; color:#fff;
    background:linear-gradient(transparent, rgba(0,0,0,.72)); transition:padding 1.1s var(--ease); }
  .ph .kicker { font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.8; }
  .ph h2 { margin:8px 0 0; font-family:'Instrument Serif', serif; font-weight:400; font-size:clamp(32px, 3.6vw, 54px);
    line-height:1; transition:font-size 1.1s var(--ease); }
  .ph p { margin:12px 0 0; max-width:440px; font-size:14px; line-height:1.55; opacity:.85; }
  /* Last place: a Gaussian-splat scan loads in the background and replaces the photo when it
     goes full screen; spots on the scan take the focus in turn as you scroll, each with its own caption. */
  .ph .scan { position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0;
    transition:opacity .5s ease 1s; }   /* on leaving, fade only after the scan has blown away */
  body.full.scan-ready .ph .scan { opacity:1; transition:opacity .6s ease .3s; cursor:grab; touch-action:none; }
  body.full.scan-ready .ph .scan:active { cursor:grabbing; }
  .spots { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .6s ease; }
  body.full.scan-ready .spots { opacity:1; transition-delay:1.2s; }
  .spot { position:absolute; left:0; top:0; width:0; height:0; }
  .spot i { position:absolute; left:-6px; top:-6px; width:12px; height:12px; border-radius:50%;
    background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); transform:scale(.7); opacity:.75;
    transition:transform .5s ease, background .4s ease, opacity .4s ease; }
  .spot.active i { background:var(--accent); transform:scale(1.25); opacity:1;
    box-shadow:0 0 0 6px rgba(168,65,42,.25); }
  .spot b { position:absolute; left:16px; top:-9px; white-space:nowrap; font-size:12px; font-weight:500;
    letter-spacing:.08em; text-transform:uppercase; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.6);
    opacity:0; transform:translateX(-6px); transition:opacity .4s ease, transform .4s ease; }
  .spot.active b { opacity:1; transform:none; transition-delay:.3s; }
  .ph figcaption > * { transition:opacity .35s ease; }
  .ph figcaption.out > * { opacity:0; }
  body.full .ph figcaption { padding:160px 64px 64px; }
  body.full .ph h2 { font-size:clamp(48px, 7vw, 110px); }

  .pin { width:0; height:0; }
  .pin i { position:absolute; left:-6px; top:-6px; width:12px; height:12px; border-radius:50%;
    background:var(--ink); opacity:0; transform:scale(.5); transition:opacity .5s ease, transform .5s ease, background .4s ease; }
  .pin.shown i { opacity:1; transform:scale(1); }
  .pin.active i { background:var(--accent); }

  /* Page opens on a blank sheet; the montage fades in from under it. */
  .cover { position:fixed; inset:0; z-index:10; background:var(--paper); pointer-events:none;
    transition:opacity 1.6s cubic-bezier(.4,0,.2,1); }
  .cover.gone { opacity:0; }

  .counter { position:fixed; top:24px; left:24px; font-size:13px; letter-spacing:.08em; color:var(--muted); z-index:2; }
  .counter b { color:var(--accent); font-weight:500; }
  .dots { position:fixed; right:24px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; z-index:2; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--ink); opacity:.18; transition:opacity .3s, transform .3s, background .3s; }
  .dots i.on { opacity:1; background:var(--accent); transform:scale(1.5); }
  body.split .dots i:not(.on) { background:#fff; opacity:.45; }
  body.full .counter { color:rgba(255,255,255,.7); }
  .hint { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); transition:opacity .4s; }
  body.chapter .hint { left:25%; }
  body.full .hint { opacity:0; }
  .maplibregl-ctrl-attrib { font-size:10px; opacity:.6; }

  @media (max-width:640px) {
    .counter { top:16px; left:16px; }
    .dots { right:12px; }
    .meta { font-size:13px; }
    .chapter-label, body.chapter .hint { left:50%; }
    .chapter-label { top:44px; }
    .photos { top:50%; width:100%; transform:translateY(100%); }
    body.split .photos { transform:translateY(0); }
    body.full .photos { top:0; }
    /* Phone full screen: show the photo at full width; a blurred copy extends it above and below. */
    .ph img { inset:auto; top:50%; left:0; height:auto; min-height:100%; transform:translateY(-50%);
      transition:min-height 1.1s var(--ease); }
    body.full .ph img { min-height:0;
      -webkit-mask-image:linear-gradient(transparent, #000 12%, #000 88%, transparent);
      mask-image:linear-gradient(transparent, #000 12%, #000 88%, transparent); }
    .ph figcaption, body.full .ph figcaption { padding:80px 16px 24px; }
    .ph p { font-size:13px; }
    body.split .hint { opacity:0; }
  }
</style>
</head>
<body>
<div class="maps" id="maps"></div>
<div class="veil"></div>

<div class="stage">
  <div>
    <div class="city"><span class="swap" id="city">Paris</span></div>
    <div class="rest">School for Social Research</div>
    <div class="meta"><span class="swap" id="meta"></span></div>
  </div>
</div>

<div class="chapter-label">Tbilisi<small>Where TSSR works</small></div>
<div class="photos" id="photos"></div>

<div class="counter"><b id="idx">01</b> / <span id="total"></span></div>
<div class="dots" id="dots"></div>
<div class="hint">Scroll</div>
<div class="cover" id="cover"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Schools of thought named after the city where the research happened. The first one opens
// the page; one scroll then runs a montage through the rest and lands on Tbilisi (the last).
const CITIES = [
  { city:'Paris',      ll:[2.3431, 48.8466],  school:'Durkheimian school',  note:'<b>L\'Année sociologique</b>, 1898 · Durkheim, Mauss · sociology as a science of social facts' },
  { city:'Chicago',    ll:[-87.5987, 41.7886], school:'Chicago School',      note:'<b>University of Chicago</b>, 1915–1935 · Park, Burgess, Thomas · the city as a laboratory' },
  { city:'Frankfurt',  ll:[8.6522, 50.1196],   school:'Frankfurt School',    note:'<b>Institut für Sozialforschung</b>, 1923 · Horkheimer, Adorno, Marcuse · critical theory' },
  { city:'Vienna',     ll:[16.3601, 48.2133],  school:'Vienna Circle',       note:'<b>Wiener Kreis</b>, 1924–1936 · Schlick, Neurath, Carnap · Lazarsfeld\'s Marienthal study, 1933' },
  { city:'New York',   ll:[-73.9969, 40.7355], school:'New School',          note:'<b>New School for Social Research</b>, 1919 · Dewey, Veblen, Beard · University in Exile, 1933' },
  { city:'Manchester', ll:[-2.2339, 53.4668],  school:'Manchester School',   note:'<b>University of Manchester</b>, 1949 → · Max Gluckman · the extended case method' },
  { city:'Toronto',    ll:[-79.3957, 43.6629], school:'Toronto School',      note:'<b>University of Toronto</b>, 1950s · Innis, McLuhan · the medium is the message' },
  { city:'Birmingham', ll:[-1.9305, 52.4508],  school:'Birmingham School',   note:'<b>Centre for Contemporary Cultural Studies</b>, 1964 · Hoggart, Stuart Hall · cultural studies' },
  { city:'Tartu',      ll:[26.7206, 58.3810],  school:'Tartu–Moscow School', note:'<b>University of Tartu</b>, 1964 → · Yuri Lotman · semiotics of culture' },
  { city:'Edinburgh',  ll:[-3.1883, 55.9445],  school:'Edinburgh School',    note:'<b>Science Studies Unit</b>, 1970s · Barnes, Bloor · the strong programme' },
  { city:'Bielefeld',  ll:[8.4935, 52.0379],   school:'Bielefeld School',    note:'<b>Bielefeld University</b>, 1970s · Wehler, Kocka · history as social science' },
  { city:'Amsterdam',  ll:[4.9114, 52.3633],   school:'Amsterdam School',    note:'<b>Amsterdam School for Social Science Research</b>, 1986 · de Swaan, Goudsblom · figurational sociology' },
  { city:'Copenhagen', ll:[12.5683, 55.6761],  school:'Copenhagen School',   note:'<b>Copenhagen Peace Research Institute</b>, 1985 · Buzan, Wæver · securitization theory' },
  { city:'Tbilisi',    ll:[44.7850, 41.7058],  school:'TSSR',                note:'<b>Tbilisi School for Social Research</b> · independent think tank · library, research centre, technology workshop' },
];
const TB = CITIES.length - 1;

// TSSR places in Tbilisi, shown one by one after the city outline. Texts are drafts.
const PLACES = [
  { ll:[44.74522, 41.72609], img:'assets/library.webp',   name:'Library about Georgia', where:'Vazha-Pshavela Ave. 43',
    text:'The first TSSR office, under the Soviet-era mosaic in Saburtalo — home of the library about Georgia.' },
  { ll:[44.81480, 41.67630], img:'assets/ortachala.webp', name:'Art Residence',         where:'Ortachala',
    text:'A residence for artists and fellows in an old house above the river in Ortachala.' },
  { ll:[44.78972, 41.70340], img:'assets/rustaveli.webp', name:'Research Centre',       where:'Rustaveli Avenue',
    text:'The research centre in the heart of the city, next to the Academy of Sciences on Rustaveli.' },
];

// Around the research centre: one per scan spot; the caption switches to it as the camera turns.
const AROUND = [
  { name:'Rustaveli Monument', where:'Rustaveli Square',
    text:'Shota Rustaveli in bronze, 1942 — the poet who gave the avenue, the square and the metro their name.' },
  { name:'Academy of Sciences', where:'Rustaveli Ave. 52',
    text:'The Georgian National Academy of Sciences in its 1950s tower, our neighbour across the street.' },
  { name:'Rustaveli Metro', where:'Rustaveli Square',
    text:'One of the first stations of the Tbilisi metro, opened in 1966, with its long escalator down.' },
  { name:'Muhudo', where:'Zandukeli St. 2',
    text:'A small falafel place behind the metro — lunch for half the research centre.' },
  { name:'Jazz Club 1984', where:'Rustaveli Ave. 37',
    text:'Live jazz every evening in an old building on the avenue.' },
  { name:'Avenue Renovation', where:'Rustaveli Avenue',
    text:'Pavements, trees and façades of the old boulevard being remade, block by block.' },
];

// The montage plays by itself on load and lands on Tbilisi.
// Steps: 0 Tbilisi · places · last place full screen as a 3D scan: an overview, then one step per scan spot.
const SPOTS = AROUND.length;
window.SCAN_SPOTS = AROUND.map(a => a.name);
const FIRST_PLACE = 1, FULL = FIRST_PLACE + PLACES.length, TOTAL = FULL + 1 + SPOTS;
window.SCAN_FULL = FULL;

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
$('total').textContent = String(TOTAL).padStart(2, '0');
$('dots').innerHTML = Array.from({ length: TOTAL }, () => '<i></i>').join('');
$('photos').innerHTML = PLACES.map((p, i) => `
  <figure class="ph"><div class="bg" style="background-image:url(${p.img})"></div><img src="${p.img}" alt="${p.name}">
    ${i === PLACES.length - 1 ? '<canvas class="scan" id="scan"></canvas><div class="spots" id="spots"></div>' : ''}
    <figcaption><div class="kicker">${String(i + 1).padStart(2, '0')} / ${String(PLACES.length).padStart(2, '0')} · ${p.where}</div>
      <h2>${p.name}</h2><p>${p.text}</p></figcaption></figure>`).join('');

const narrow = () => innerWidth <= 640;

// Frame the TSSR places in the half of the screen the photos leave free, so all pins
// are visible when they appear and the camera never has to move.
function tbilisiCamera(map) {
  const pts = PLACES.map(p => p.ll);
  const b = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  const pad = narrow()
    ? { top: 130, left: 60, right: 60, bottom: innerHeight / 2 + 60 }
    : { top: 170, left: 110, right: innerWidth / 2 + 110, bottom: 110 };
  return map.cameraForBounds(b, { padding: pad }) || { center: CITIES[TB].ll, zoom: 13 };
}

const STYLE = 'https://tiles.openfreemap.org/styles/positron';
function hideLabels(map) {               // map labels compete with the title
  map.getStyle().layers.filter(l => l.type === 'symbol')
    .forEach(l => map.setLayoutProperty(l.id, 'visibility', 'none'));
}

// One layer per city, stacked and parked above/below the screen. The first city and Tbilisi
// are live maps; the montage cities in between are pre-rendered 1920×1080 snapshots of the
// same style (assets/cities/<city>.webp), so the strip never shows blank tiles.
const pins = [], maps = [];
const slug = c => c.city.toLowerCase().replace(/[^a-z]+/g, '-');
const layers = CITIES.map((c, k) => {
  const el = document.createElement('div');
  el.className = 'map';
  el.style.transform = k ? 'translateY(100%)' : 'none';
  $('maps').appendChild(el);
  if (k === 0 || k === TB) maps[k] = liveMap(el, c, k);
  else el.innerHTML = `<img alt="" src="assets/cities/${slug(c)}.webp">`;
  return el;
});

function liveMap(el, c, k) {
  const map = new maplibregl.Map({
    container: el,
    style: STYLE,
    center: c.ll, zoom: 13, interactive: false,
    attributionControl: { compact: true },
  });
  if (k === TB) map.jumpTo(tbilisiCamera(map));
  map.on('load', () => {
    map.resize();
    hideLabels(map);
    if (k === TB) map.jumpTo(tbilisiCamera(map));
  });
  if (k === TB) PLACES.forEach(p => {
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.innerHTML = '<i></i>';
    new maplibregl.Marker({ element: pin }).setLngLat(p.ll).addTo(map);
    pins.push(pin);
  });
  return map;
}
window.addEventListener('resize', () => {
  maps.forEach(m => m && m.resize());
  maps[TB].jumpTo(tbilisiCamera(maps[TB]));
});

function swapText(el, html, dir, d = 900, reel = false) {
  const up = dir > 0, tok = el._tok = (el._tok || 0) + 1, cls = reel ? 'reel-' : '';
  const outT = reel ? d * 0.35 : d * 0.45, inT = reel ? d * 0.8 : d * 0.45;
  el.style.transitionDuration = outT + 'ms';
  el.className = 'swap ' + cls + (up ? 'out-up' : 'out-down');
  setTimeout(() => {
    if (tok !== el._tok) return;
    el.innerHTML = html;
    el.className = 'swap ' + cls + (up ? 'pre-up' : 'pre-down');
    void el.offsetWidth;               // commit the "pre" state before animating in
    el.style.transitionDuration = inT + 'ms';
    el.className = 'swap';
  }, outT);
}

let shown = 0;                         // index of the city layer on screen
function showCity(idx, dir, d) {
  const inEl = layers[idx], outEl = layers[shown];
  const tr = `transform ${d}ms cubic-bezier(.45,0,.25,1), filter .6s ease`;
  inEl.style.transition = 'none';
  inEl.style.transform = `translateY(${dir > 0 ? 100 : -100}%)`;
  void inEl.offsetWidth;
  inEl.style.transition = tr;
  inEl.style.transform = 'translateY(0)';
  outEl.style.transition = tr;
  outEl.style.transform = `translateY(${dir > 0 ? -100 : 100}%)`;
  swapText($('city'), CITIES[idx].city, dir, d, true);
  shown = idx;
}

// Run through every city between the current one and `to`: it starts fast and decays,
// each hop longer than the last, until it settles on the destination. Each hop starts
// before the previous one has settled, so the maps run as one continuous strip.
async function montage(to, dir) {
  const path = [];
  for (let i = shown + dir; dir > 0 ? i <= to : i >= to; i += dir) path.push(i);
  const m = $('meta');
  m._tok = (m._tok || 0) + 1;
  m.style.transitionDuration = '';
  m.className = 'swap ' + (dir > 0 ? 'out-up' : 'out-down');
  for (let j = 0; j < path.length; j++) {
    const t = path.length > 1 ? j / (path.length - 1) : 1;
    const d = Math.round(110 + 330 * Math.pow(t, 2.5));
    showCity(path[j], dir, d);
    await wait(j === path.length - 1 ? d * 0.7 : d * 0.68);
  }
  const c = CITIES[to];
  swapText(m, c.school + ' — ' + c.note, dir);
  await wait(500);
}

function showPins(active) {            // active: index of the current place, -1 = none
  pins.forEach((p, k) => {
    p.classList.toggle('shown', k <= active);
    p.classList.toggle('active', k === active);
  });
}

function showPhoto(active) {
  [...$('photos').children].forEach((el, k) => {
    el.classList.toggle('on', k === active);
    el.classList.toggle('past', k < active);
  });
}

// Last place's caption: the place itself, or the scan spot in focus. Text fades out, swaps, fades in.
const lastCap = () => $('photos').lastElementChild.querySelector('figcaption');
let capKey = -1, capTimer;
function scanCaption(k) {
  if (k === capKey) return;
  capKey = k;
  const p = PLACES[PLACES.length - 1], a = AROUND[k];
  const kicker = a ? `${String(k + 1).padStart(2, '0')} / ${String(AROUND.length).padStart(2, '0')} · ${a.where}`
    : `${String(PLACES.length).padStart(2, '0')} / ${String(PLACES.length).padStart(2, '0')} · ${p.where}`;
  const cap = lastCap();
  cap.classList.add('out');
  clearTimeout(capTimer);
  capTimer = setTimeout(() => {
    cap.querySelector('.kicker').textContent = kicker;
    cap.querySelector('h2').textContent = a ? a.name : p.name;
    cap.querySelector('p').textContent = a ? a.text : p.text;
    cap.classList.remove('out');
  }, 350);
}

function render(i, dir) {
  scanCaption(i > FULL ? i - FULL - 1 : -1);    // the overview keeps the place's own caption
  document.body.classList.toggle('chapter', i >= FIRST_PLACE);
  document.body.classList.toggle('split', i >= FIRST_PLACE);
  document.body.classList.toggle('full', i >= FULL);
  window.scanFocus = i >= FULL ? i - FULL : -1;   // read by the scan module every frame: 0 overview, then the spots
  window.scanStep = i;                             // the scan module stages its loading on this
  window.dispatchEvent(new Event('scanstep'));
  $('idx').textContent = String(i + 1).padStart(2, '0');
  [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === i));

  if (i === 0) {
    showPins(-1);
    if (dir < 0) showPhoto(0);         // panel slides out with the first photo in place
    return;
  }
  if (i < FULL) {
    const k = i - FIRST_PLACE;
    showPhoto(k);
    setTimeout(() => showPins(k), dir > 0 && k === 0 ? 700 : 300);
  }
}

let current = 0, locked = false;

function go(dir) {
  const next = current + dir;
  if (locked || next < 0 || next >= TOTAL) return;
  locked = true;
  current = next;
  Promise.all([wait(1300), render(current, dir)]).then(() => locked = false);
}

let acc = 0;
window.addEventListener('wheel', e => {
  e.preventDefault();
  acc += e.deltaY;
  if (Math.abs(acc) > 40) { go(Math.sign(acc)); acc = 0; }
}, { passive: false });

window.addEventListener('keydown', e => {
  if (['ArrowDown', 'PageDown', ' '].includes(e.key)) go(1);
  if (['ArrowUp', 'PageUp'].includes(e.key)) go(-1);
});

let touchY = null;
window.addEventListener('touchstart', e => touchY = e.touches[0].clientY, { passive: true });
window.addEventListener('touchend', e => {
  if (window.scanDragged) { window.scanDragged = false; touchY = null; return; }   // was orbiting the scan
  if (touchY === null) return;
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 40) go(Math.sign(dy));
  touchY = null;
});

$('city').textContent = CITIES[0].city;
render(0, 0);
showPhoto(0);

// Intro: a blank sheet until the first map has drawn, then the montage runs to Tbilisi
// while the sheet fades away; scrolling waits for it.
(async () => {
  locked = true;
  if (document.hidden)                 // opened in a background tab: play it when it is seen
    await new Promise(r => document.addEventListener('visibilitychange', r, { once: true }));
  await Promise.race([new Promise(r => maps[0].once('idle', r)), wait(2500)]);
  await wait(300);
  $('cover').classList.add('gone');
  await montage(TB, 1);
  locked = false;
})();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
} }
</script>
<script type="module">
// Gaussian-splat scan for the last place: our drone survey of Rustaveli Square (SCA-102, Brush),
// built with tools/splat/build.sh. The file downloads as soon as the page opens; the heavy steps are
// spread over the three slides before it (decode, set-up, warm-up frame), each once that slide
// has settled, so none of them stalls a transition. It only draws while on screen.
import * as THREE from 'three';
import { SparkRenderer, SplatMesh, dyno } from '@sparkjsdev/spark';

const canvas = document.getElementById('scan'), spotsEl = document.getElementById('spots');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
const touch = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, touch ? 1.15 : 1.5));   // phones: splats are fill-bound
renderer.setClearColor(0x1b1814);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 500);
const spark = new SparkRenderer({ renderer, apertureAngle: 0, focalDistance: 1 });
scene.add(spark);

const FULL = window.SCAN_FULL;
const bytes = fetch('assets/splats/rustaveli.sog').then(r => r.arrayBuffer());
const reach = n => new Promise(r => {
  const f = () => { if ((window.scanStep ?? 0) >= n) { removeEventListener('scanstep', f); r(); } };
  addEventListener('scanstep', f); f();
});
const idle = () => new Promise(r => (window.requestIdleCallback || setTimeout)(r, { timeout: 500 }));
async function stage(n) {                // wait for slide n; if the visitor stops there, let it settle
  await reach(n);
  if (window.scanStep === n) await new Promise(r => setTimeout(r, 1100));
  await idle();
}

await stage(FULL - 3);
// lod: Spark builds a level-of-detail tree in a worker and each frame draws only a budget of splats
// (1.5M on iOS, 2.5M on desktop) picked for the view: what is on screen, coarser with distance.
const city = new SplatMesh({ fileBytes: await bytes, fileName: 'rustaveli.sog', lod: true });
// The file is in the raw RealityScan/COLMAP frame (−y up, about 1.1 m per unit). Everything below is
// in gsplat's normalized frame of the same cameras (z up, 1 unit ≈ 110 m): NORM maps raw to that
// (see tools/splat/README.md), then a quarter turn makes it y-up.
const NORM = new THREE.Matrix4().set(
  0.00921831, 0.00159341, -0.00405399, 0.06303984,
  0.0043536, -0.00306282, 0.00869576, 0.0112516,
  0.00014116, -0.00959329, -0.00344962, -0.18225071,
  0, 0, 0, 1);
city.matrixAutoUpdate = false;
city.matrix.makeRotationX(-Math.PI / 2).multiply(NORM);
scene.add(city);
await city.initialized;
city.updateMatrixWorld();

await stage(FULL - 2);

// The places in scan coordinates (z up, 1 unit ≈ 110 m), placed by laying the OSM building
// outlines over a top view of the scan, and how the camera sees each: bearing in the scan's x–y
// plane and elevation (degrees), distance, and lens (vertical field of view, degrees) — long
// lenses from far off and low over the roofs. The bearings face the side the drone flew, where
// the scan is sharp.
// Overview: low from First Republic Square, looking west along the avenue — sky, Mtatsminda with
// the TV tower, the Academy front and tower. The drone never flew lower than this, so the roof in
// front stays soft; the focus is on the Academy, which blurs it like a foreground.
const OVERVIEW = { p: [-0.134, -0.055, 0.081], az: 119.4, el: -27, d: 1.4, fov: 45 };
const VIEWS = {
  'Rustaveli Monument':  { p: [-0.669, -0.165, -0.137], az: 150, el: 10, d: 1.6, fov: 16 },   // against the metro dome
  'Academy of Sciences': { p: [-0.083, 0.004, 0.1], az: 150, el: 14, d: 1.6, fov: 28 },
  'Rustaveli Metro':     { p: [-1.017, -0.253, -0.15], az: 12, el: 35, d: 1.1, fov: 30 },    // the round entrance behind the monument, from the Academy side
  'Muhudo':              { p: [-0.542, -0.501, -0.05], az: 100, el: 22, d: 1.4, fov: 24 },
  'Jazz Club 1984':      { p: [0.073, 0.587, -0.33], az: 10, el: 32, d: 1.4, fov: 26 },     // its avenue front
  'Avenue Renovation':   { p: [-0.33, 0.18, -0.25], az: 170, el: 28, d: 1.4, fov: 28 },   // the dug-up pavement at the ring
};
const world = ([x, y, z]) => new THREE.Vector3(x, z, -y);
const U_EYE = new THREE.Vector3();
const rad = v => ({ az: THREE.MathUtils.degToRad(v.az), el: THREE.MathUtils.degToRad(v.el), d: v.d, fov: v.fov });
const names = window.SCAN_SPOTS;
const spots = names.map(s => world(VIEWS[s].p));
// Camera stops, one per scroll step: 0 the overview, then the spots.
const targets = [world(OVERVIEW.p), ...spots], views = [rad(OVERVIEW), ...names.map(s => rad(VIEWS[s]))];
const center = world([-0.4, -0.1, -0.2]);           // the square: the reveal grows from here
const START = views[0];
{ // where the overview camera stands (without its drift): splats round it are dropped, see below
  const { az, el, d } = views[0];
  U_EYE.copy(targets[0]).add(new THREE.Vector3(Math.cos(el) * Math.cos(az), Math.sin(el), -Math.cos(el) * Math.sin(az)).multiplyScalar(d));
}   // before the scan shows: further back, so it flies in
spotsEl.innerHTML = names.map(s => `<div class="spot"><i></i><b>${s}</b></div>`).join('');
const spotEls = [...spotsEl.children];

// Effects, all per splat on the GPU (world space):
//  reveal  – first show: a sphere grows from the middle of the places, splats swell into place
//            as it reaches them, glowing at its edge; at the end it races out over the background;
//  dust    – leaving back to the photos: the scan blows away upwards;
//  wave    – when a spot takes the focus an (unseen) sphere grows out of it: a bright seam where
//            it cuts the scan; inside the sphere the scan keeps its colour (up to a radius),
//            outside it the scan is black and white.
const U = {
  focus: dyno.dynoVec3(center.clone()), focusAmt: dyno.dynoFloat(0), wave: dyno.dynoFloat(99),
  reveal: dyno.dynoFloat(0), dust: dyno.dynoFloat(0), eye: dyno.dynoVec3(U_EYE), cut: dyno.dynoFloat(0),
};
const SPAN = 1.4, f = v => v.toFixed(4);     // across the places, in scan units
const WAVE_SPEED = .45;                  // sphere radius growth, spans per second
const fx = new dyno.Dyno({
  inTypes: { gsplat: dyno.Gsplat, focus: 'vec3', focusAmt: 'float', wave: 'float',
    reveal: 'float', dust: 'float', eye: 'vec3', cut: 'float' },
  outTypes: { gsplat: dyno.Gsplat },
  globals: () => [`
    float fxHash(int i) {
      uint x = uint(i);
      x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16;
      return float(x) / 4294967295.0;
    }`],
  statements: ({ inputs: I, outputs: O }) => `
    ${O.gsplat} = ${I.gsplat};
    vec3 p = ${O.gsplat}.center;
    vec3 c = ${O.gsplat}.rgba.rgb;
    float a = ${O.gsplat}.rgba.a;
    vec3 sc = ${O.gsplat}.scales;
    float h = fxHash(${O.gsplat}.index);
    const vec3 ACC = vec3(1.0);   // all glows are white; colour is kept only round the spot
    const float SPAN = ${f(SPAN)};

    float fd = length(p - ${I.focus});
    float front = ${I.wave} * SPAN * ${f(WAVE_SPEED)};
    float R = min(front, SPAN * 0.22);
    float inside = 1.0 - smoothstep(R * 0.3, R * 1.3, fd);       // colour fades out with distance
    float lum = dot(c, vec3(0.299, 0.587, 0.114));
    c = mix(c, vec3(lum) * 0.85, ${I.focusAmt} * (1.0 - inside));

    float ring = (fd - front) / (SPAN * 0.03);
    float w = exp(-ring * ring) * exp(-${I.wave} * 3.5);          // dies out within ~a third of a span
    c += ACC * w * 1.4;
    sc *= 1.0 + w * 0.5;

    const vec3 MID = vec3(${f(center.x)}, ${f(center.y)}, ${f(center.z)});
    // Distance behind the front (> 0: the sphere has passed). Splats are capped in size by that
    // distance so none spills over the front, which keeps the edge sharp; a hair-thin shell of
    // small white splats right on the front draws the line. Past the places the front speeds up
    // (the pow term) so the hills and the sky are in before it ends.
    float rev = ${I.reveal};
    float edge = rev >= 1.0 ? 1e3 : rev * SPAN * 0.9 + pow(rev, 6.0) * 40.0 - length(p - MID);
    const float LW = SPAN * 0.004;
    float line = exp(-pow(edge / LW, 2.0));
    if (edge < 1e3) {
      sc = edge > 0.0 ? min(sc, vec3(edge * 0.4)) : vec3(0.0);
      sc = max(sc, vec3(LW * line));
      c = mix(c, ACC, line);
      a = max(a * step(0.0, edge), line);
    }

    // Overview: the camera hangs low next to a tree; splats this close to it are dropped.
    a *= smoothstep(${I.cut} * 0.6, ${I.cut}, length(p - ${I.eye}));

    float d = clamp(${I.dust} * 2.0 - h, 0.0, 1.0);
    p += vec3(sin(h * 41.0) * 0.6 + 0.8, 1.6, cos(h * 73.0) * 0.6) * d * d * 0.35;
    sc *= 1.0 - d * 0.75;
    a *= 1.0 - d;

    ${O.gsplat}.center = p;
    ${O.gsplat}.scales = sc;
    ${O.gsplat}.rgba = vec4(clamp(c, 0.0, 1.0), a);   // packed as 8-bit: overflow would wrap`.trim().split('\n'),
});
city.worldModifier = dyno.dynoBlock({ gsplat: dyno.Gsplat }, { gsplat: dyno.Gsplat },
  ({ gsplat }) => ({ gsplat: fx.apply({ gsplat, ...U }).gsplat }));
city.updateGenerator();

// Effect clocks, driven from the scroll position (k = spot in focus, -1 = not on the scan).
let fxK = -1, enterAt = -1e9, leaveAt = -1e9, spotAt = -1e9, lastSig = '';
function effects(t, k, dt) {
  if (k !== fxK) {
    if (fxK < 0 && k >= 0) { enterAt = t; spotAt = -1e9; }   // first spot: no wave, the reveal is enough
    else if (k < 0) leaveAt = t;
    else spotAt = t;
    if (k >= 0) U.focus.value.copy(targets[k]);
    fxK = k;
  }
  const s = ms => Math.max(0, ms) / 1000;
  U.reveal.value = k >= 0 ? Math.min(1, s(t - enterAt - 400) / 2.6) : U.reveal.value;
  U.dust.value = k < 0 ? Math.min(1, s(t - leaveAt) / 1.3) : 0;
  U.wave.value = Math.min(99, s(t - spotAt));
  U.cut.value = k === 0 ? .35 : U.cut.value * Math.exp(-dt * .003);   // on at once, off gently
  // After the reveal the colour drains from the outside in over about a second (not on the overview).
  U.focusAmt.value += ((k > 0 && t - enterAt > 3000 ? 1 : 0) - U.focusAmt.value) * (1 - Math.exp(-dt * .0015));
  // Re-run the per-splat effects only while something animates; a still scan costs nothing extra.
  const sig = [U.reveal.value, U.dust.value, U.focusAmt.value.toFixed(3), U.wave.value < 3 ? U.wave.value : 3,
    U.cut.value.toFixed(3), k].join();
  if (sig !== lastSig) { lastSig = sig; city.updateVersion(); }
}

// Camera: starts on the overview, then flies from place to place, each seen from its own side,
// height and lens; in between it drifts slowly. The focus plane follows the place.
const aim = center.clone(), dir = new THREE.Vector3(), tmp = new THREE.Vector3();
let camAz = START.az, camEl = START.el, camD = START.d, camFov = START.fov, focal = 1, shownAt = -1e9, lastW = 0, lastH = 0;

// Dragging the scan orbits the camera round the spot in focus (mouse: both ways; touch: sideways
// only, so vertical swipes still change slides). The offset stays after release and eases back
// to zero when the next spot takes the focus.
const UP = new THREE.Vector3(0, 1, 0), side = new THREE.Vector3(), off = new THREE.Vector3();
let yaw = 0, pitch = 0, yawTo = 0, pitchTo = 0, heldTo = 0, swayT = 0, dragK = -1, drag = null;
canvas.addEventListener('pointerdown', e => {
  if ((window.scanFocus ?? -1) < 0) return;
  heldTo = 1;
  drag = { x: e.clientX, y: e.clientY, touch: e.pointerType === 'touch', moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.touch && !drag.moved && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }   // a swipe
  drag.moved = drag.moved || Math.abs(dx) + Math.abs(dy) > 4;
  if (drag.touch && drag.moved) window.scanDragged = true;   // tells the swipe handler to stand down
  yawTo = THREE.MathUtils.clamp(yawTo - dx * .006, -1.3, 1.3);
  if (!drag.touch) pitchTo = THREE.MathUtils.clamp(pitchTo + dy * .004, -.15, .5);   // drag down: look from above
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = () => { drag = null; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
function place(t, k, dt) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w !== lastW || h !== lastH) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Wide screens: nudge the picture right so the caption on the left does not cover it.
    if (w > h) camera.setViewOffset(w, h, -w * .12, 0, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    lastW = w; lastH = h;
  }
  const v = k >= 0 ? views[k] : START, target = k >= 0 ? targets[k] : center;
  if (k !== dragK) { yawTo = pitchTo = 0; heldTo = 0; dragK = k; }
  // Once the visitor takes the camera the drift and bob stop, so nothing but the drag moves the view.
  if (!heldTo) swayT += dt;            // the drift's clock stops (without a jump) while held
  const ease = 1 - Math.exp(-dt * .0016);
  camAz += Math.atan2(Math.sin(v.az - camAz), Math.cos(v.az - camAz)) * ease;   // the short way round
  camEl += (v.el - camEl) * ease;
  camD += (v.d - camD) * ease;
  // Portrait: a wider lens instead of stepping back, which would put the camera where the drone never flew.
  camFov += (Math.min(v.fov * (w > h ? 1 : 1.4), 70) - camFov) * ease;
  camera.fov = camFov;
  camera.updateProjectionMatrix();
  aim.lerp(target, ease);
  const az = camAz + Math.sin(swayT * .00012) * .1, el = camEl + Math.sin(swayT * .0002) * .03;
  dir.set(Math.cos(el) * Math.cos(az), Math.sin(el), -Math.cos(el) * Math.sin(az));
  const ue = 1 - Math.exp(-dt * .012);
  yaw += (yawTo - yaw) * ue; pitch += (pitchTo - pitch) * ue;
  // Orbit: turn the camera round the spot it looks at, so the spot keeps its place on screen.
  off.copy(dir).multiplyScalar(camD).applyAxisAngle(UP, yaw);
  side.crossVectors(off, UP).normalize();
  off.applyAxisAngle(side, pitch);
  camera.position.copy(aim).add(off);
  // In flight the camera rises over the roofs and settles into the next view only as it arrives,
  // so it never cuts through the scan between two low views. At rest this is zero.
  camera.position.y += aim.distanceTo(target) * .6 + Math.abs(camD - v.d) * .3;
  camera.lookAt(aim);
  camera.updateMatrixWorld();          // the dots are projected before render: use this frame's camera
  focal += (camera.position.distanceTo(target) - focal) * ease;
  spark.focalDistance = focal;
  spark.apertureAngle = k > 0 ? .012 : k === 0 ? .008 : 0;   // overview: just enough to soften the near roof
}

function drawSpots(k) {
  spotEls.forEach((el, j) => {
    tmp.copy(spots[j]).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    el.style.display = vis ? '' : 'none';
    el.style.transform = `translate(${(tmp.x + 1) / 2 * lastW}px, ${(1 - tmp.y) / 2 * lastH}px)`;
    el.classList.toggle('active', j === k - 1);
  });
}

await stage(FULL - 1);
place(0, -1, 1e6);
renderer.render(scene, camera);        // warm-up: compile shaders and sort before it is seen
document.body.classList.add('scan-ready');

let prev = performance.now();
renderer.setAnimationLoop(t => {
  const dt = Math.min(t - prev, 100); prev = t;
  const k = window.scanFocus ?? -1;
  if (k >= 0) shownAt = t;
  if (t - shownAt > 1500) return;      // off screen: keep the GPU idle
  place(t, k, dt);
  effects(t, k, dt);
  drawSpots(k);
  renderer.render(scene, camera);
});
</script>
